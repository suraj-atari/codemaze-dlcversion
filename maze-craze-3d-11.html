<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Maze Craze 3D — a game of cops 'n robbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000; --white:#F4F1E8; --yellow:#F2C51B; --red:#D9261C; --green:#3D8A2E; --blue:#1E5BC6; --orange:#E8662A;
    --atari:#5FA84A; --bg:#000;
    box-sizing:border-box;
  }
  :root:not([data-theme="light"]){ --bg:#000; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
  :root[data-theme="dark"]{ --bg:#000; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  body{font-family:"Silkscreen",ui-monospace,"Courier New",monospace;color:var(--white)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
  .hidden{display:none!important}
  button{font:inherit;font-size:15px;border:0;cursor:pointer;padding:13px 22px;min-height:48px;color:var(--black);background:var(--yellow)}
  button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  .musicBtn{white-space:nowrap}
  button.ghost{background:transparent;color:var(--white);box-shadow:inset 0 0 0 2px var(--white)}
  button:active{transform:translateY(1px)}

  /* title */
  #title{justify-content:flex-end;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 38%,rgba(0,0,0,0) 62%)}
  #title h1{font-family:"Righteous","Trebuchet MS",sans-serif;font-weight:400;font-size:clamp(46px,11vw,92px);line-height:.9;margin:0;letter-spacing:.01em}
  #title h1 small{display:block;font-size:.34em;color:var(--yellow);margin-top:.35em;letter-spacing:.02em}
  #title p{max-width:32ch;font-size:13px;line-height:1.6;opacity:.85;margin:16px 0 22px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* levels */
  #levels{background:rgba(0,0,0,.88);justify-content:flex-start;overflow:auto;padding-top:calc(28px + env(safe-area-inset-top,0px))}
  #levels h2{font-family:"Righteous",sans-serif;font-weight:400;font-size:32px;margin:0 0 4px}
  #levels .sub{font-size:12px;opacity:.7;margin-bottom:18px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(680px,100%);margin-bottom:18px}
  .lvl{background:#101010;color:var(--white);text-align:left;padding:12px;min-height:92px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 2px #2a2a2a}
  .lvl .n{font-size:26px;color:var(--atari);line-height:1}
  .lvl .nm{font-size:12px}
  .lvl .chips{display:flex;gap:4px;margin-top:auto}
  .lvl .chip{width:14px;height:10px}
  .lvl .st{font-size:14px;color:var(--yellow);letter-spacing:2px;min-height:14px}
  .lvl.locked{opacity:.35}
  .lvl.done .n::after{content:""}
  #legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:10px;opacity:.8;max-width:680px;margin-bottom:18px}
  #legend span{display:inline-flex;align-items:center;gap:5px}
  #legend i{width:12px;height:9px;display:inline-block}

  /* hud */
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;
       display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
  .dig{font-size:30px;color:var(--atari);line-height:1;text-shadow:0 2px 0 #000}
  .dig small{display:block;font-size:9px;color:var(--white);opacity:.7;margin-top:3px}
  #hudL{justify-self:start;text-align:left} #hudC{justify-self:center;text-align:center} #hudR{justify-self:end;text-align:right;display:flex;gap:12px;align-items:start}
  #pause{pointer-events:auto;min-height:40px;padding:8px 12px;background:rgba(0,0,0,.5);color:var(--white);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
  #bars{display:flex;gap:6px;justify-content:center;margin-top:6px;min-height:10px}
  #bars i{width:22px;height:8px;display:block}
  #info{font-size:11px;margin-top:5px;opacity:.9}
  #action{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:78px;height:78px;border-radius:50%;background:rgba(217,38,28,.85);color:var(--white);font-size:11px;line-height:1.2;padding:0;
    box-shadow:0 0 0 3px rgba(0,0,0,.4)}
  #action:disabled{opacity:.35}
  #toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(88vw,420px);
    background:rgba(0,0,0,.72);padding:12px 14px;font-size:12px;line-height:1.55;text-align:center;pointer-events:none;transition:opacity .35s;box-shadow:inset 0 0 0 2px var(--atari)}
  #toast.off{opacity:0}
  #toast b{display:block;color:var(--yellow);font-weight:400;font-size:14px;margin-bottom:3px}
  #swipe{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;opacity:.75;pointer-events:none;transition:opacity .5s}

  /* cards */
  .card{background:rgba(0,0,0,.86);padding:26px 24px;width:min(90vw,380px);box-shadow:inset 0 0 0 3px var(--c,var(--yellow))}
  .card h3{font-family:"Righteous",sans-serif;font-weight:400;font-size:36px;margin:0 0 6px;color:var(--c,var(--yellow))}
  #cStars{font-size:30px;color:var(--yellow);letter-spacing:4px;margin:-2px 0 8px;min-height:0}
  .card p{font-size:12px;line-height:1.6;margin:0 0 18px;opacity:.9}
  #flash{position:fixed;inset:0;pointer-events:none;background:var(--red);opacity:0;transition:opacity .25s}
  #rotate{font-size:11px;opacity:.7;margin-top:12px}
  @media (prefers-reduced-motion: reduce){ #toast,#flash{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="Maze Craze 3D game view"></canvas>

<button id="mTitle" class="musicBtn ghost" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;min-height:40px;padding:8px 12px;z-index:5">♪ on</button>
<div id="title" class="layer">
  <h1>Maze Craze<small>A game of cops 'n robbers</small></h1>
  <p>Get your cop from the left side of the city maze to the exit on the right. Swipe to run. Tap for your special move.</p>
  <div class="row"><button id="bPlay">Play beat 1</button><button id="bLevels" class="ghost">Choose a beat</button></div>
</div>

<div id="levels" class="layer hidden">
  <h2>Choose your beat</h2>
  <div class="sub">Clear a beat to unlock the next one.</div>
  <div id="grid"></div>
  <div id="legend"></div>
  <button id="bBack" class="ghost">Back</button>
</div>

<div id="hud" class="hidden">
  <div id="hudL" class="dig"><span id="hSpeed">1</span><small>speed</small></div>
  <div id="hudC"><div class="dig"><span id="hGame">1</span><small>game</small></div><div id="bars"></div><div id="info"></div></div>
  <div id="hudR"><div class="dig"><span id="hVis">1</span><small>visibility</small></div><button id="mHud" class="musicBtn" style="pointer-events:auto;min-height:40px;padding:8px 10px;background:rgba(0,0,0,.5);color:var(--white);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)">♪ on</button><button id="pause" aria-label="Pause">II</button></div>
</div>
<button id="action" class="hidden">PEEK</button>
<div id="toast" class="off"></div>
<div id="swipe" class="hidden">Swipe anywhere to run</div>
<div id="flash"></div>

<div id="endCard" class="layer hidden"><div class="card" id="card"><h3 id="cTitle"></h3><div id="cStars" aria-label="Stars"></div><p id="cText"></p><div class="row" id="cBtns"></div></div></div>
<div id="pauseCard" class="layer hidden"><div class="card"><h3>Paused</h3><p id="pText"></p><div class="row"><button id="bResume">Resume</button><button id="bRetry2" class="ghost">Restart</button><button id="bMenu2" class="ghost">Beats</button></div></div></div>
<div id="loading" class="layer">Loading</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function rng(seed){ seed=(seed>>>0)%2147483646+1; return ()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; }
function genMaze(seed){
  const r=rng(seed*7919+13), g=[...Array(GH)].map(()=>Array(GW).fill('#'));
  const CW=(GW-1)/2, CH=(GH-1)/2, seen=new Set(), st=[[0,CH-1]]; seen.add('0,'+(CH-1)); g[GH-2][1]='.';
  while(st.length){
    const [a,b]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([da,db])=>[a+da,b+db,da,db]).filter(([x,y])=>x>=0&&y>=0&&x<CW&&y<CH&&!seen.has(x+','+y));
    if(!nb.length){ st.pop(); continue; }
    const [x,y,da,db]=nb[Math.floor(r()*nb.length)];
    g[2*b+1+db][2*a+1+da]='.'; g[2*y+1][2*x+1]='.'; seen.add(x+','+y); st.push([x,y]);
  }
  for(let k=0;k<30;k++){                                // open some loops so robbers can be dodged
    const i=1+Math.floor(r()*(GW-2)), j=1+Math.floor(r()*(GH-2));
    if(g[j][i]!=='#') continue;
    if((i%2===0&&j%2===1&&g[j][i-1]==='.'&&g[j][i+1]==='.')||(i%2===1&&j%2===0&&g[j-1][i]==='.'&&g[j+1][i]==='.')) g[j][i]='.';
  }
  const er=2*(1+Math.floor(r()*(CH-2)))+1; g[er][GW-1]='.';
  return g.map(row=>row.join(''));
}

function bevel(g,x,y,w,h,light='#b9cbc2',dark='#1f2926',lw=3){
  g.fillStyle=light; g.fillRect(x,y,w,lw); g.fillRect(x,y,lw,h);

function newMover(i,j,speed){ return {i,j,ni:i,nj:j,dir:[0,0],want:null,moving:false,prog:0,speed,dist:0,stun:0,invuln:0,yaw:0,alive:true,running:false,stepAcc:0}; }
function resetActors(){
  robbers.forEach(r=>scene.remove(r.fig.root)); robbers=[];

      if(robbers.every(o=>Math.abs(o.i-c[0])+Math.abs(o.j-c[1])>6)){ pick=c; break; } }

// ================= movement =================
function stepMover(m,dt,choose,arrive){
  let rem=m.speed*dt, moved=0, guard=0;
  while(rem>1e-6&&guard++<8){
    if(!m.moving){ const d=choose(m); if(!d) break; m.dir=d; m.ni=m.i+d[0]; m.nj=m.j+d[1]; m.prog=0; m.moving=true; }
    const len=m.dir[0]!==0?1:CZ, need=(1-m.prog)*len;
    if(rem>=need){ rem-=need; moved+=need; m.i=m.ni; m.j=m.nj; m.moving=false; m.prog=0; if(arrive) arrive(m); }
    else { m.prog+=rem/len; moved+=rem; rem=0; }
  }
  m.dist+=moved; return moved;
}
function posOf(m,v=new THREE.Vector3()){ cellPos(m.i,m.j,v); if(m.moving){ const b=cellPos(m.ni,m.nj); v.lerp(b,m.prog); } return v; }
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
function copChoose(m){
  if(m.want&&isOpen(m.i+m.want[0],m.j+m.want[1])){ m.running=true; return m.want; }
  if(m.running&&isOpen(m.i+m.dir[0],m.j+m.dir[1])) return m.dir;
  if(m.running){ sfx.bump(); m.running=false; }
  return null;
}
function copArrive(m){
  const key=m.j*GW+m.i; if(key!==m.lastCell){ m.lastCell=key; distField=bfs([m.i,m.j]); }
  if(m.i===GW-1) reachExit();
}
const robOpen=(i,j)=>isOpen(i,j)&&i<GW-1&&!(blockade.cell&&blockade.cell[0]===i&&blockade.cell[1]===j);
function robChoose(m){
  const opts=DIRS.filter(d=>robOpen(m.i+d[0],m.j+d[1])); if(!opts.length) return null;
  let c=opts.filter(d=>!(d[0]===-m.dir[0]&&d[1]===-m.dir[1])); if(!c.length) c=opts;
  const df=d=>distField[(m.j+d[1])*GW+m.i+d[0]];
  if(LV.capture){ if(Math.random()<0.7) return c.reduce((a,b)=>df(b)>df(a)?b:a); }
  else if(Math.random()<(LV.aggr||0.5)) return c.reduce((a,b)=>df(b)<df(a)?b:a);
  return c[Math.floor(Math.random()*c.length)];
}
function setWant(d){
  if(state!=='play'||paused) return;
  audio(); hideSwipeHint();
  cop.want=d;
  if(cop.moving&&d[0]===-cop.dir[0]&&d[1]===-cop.dir[1]){ [cop.i,cop.ni]=[cop.ni,cop.i]; [cop.j,cop.nj]=[cop.nj,cop.j]; cop.prog=1-cop.prog; cop.dir=d; }
}

// ================= actions: peek / blockade =================
function doAction(){
  if(state!=='play'||paused) return; audio();
  if(LV.peek==='player'){ if(peeksLeft>0&&peekT<=0){ peeksLeft--; peekT=1.4; sfx.peek(); } else if(peeksLeft<=0) toast('No peeks left','Find your own way out.'); }
  else if(LV.blockade){
    const c=[cop.i,cop.j]; blockade.cell=c; blockade.t=8;
    const alongX=isOpen(c[0]-1,c[1])||isOpen(c[0]+1,c[1]);
    const p=cellPos(c[0],c[1]); blockade.g.position.copy(p);
    blockade.g.rotation.y=alongX?0:Math.PI/2; blockade.g.scale.set(1,1,alongX?(CZ-0.05)/0.95:1);
    blockade.g.visible=true; sfx.block();

}

// ================= scout =================
function scoutPath(){
  let i=cop.i,j=cop.j,prev=null; const p=[[i,j]];
  for(let k=0;k<8;k++){
    const o=DIRS.map(d=>[i+d[0],j+d[1]]).filter(([x,y])=>isOpen(x,y)&&!(prev&&prev[0]===x&&prev[1]===y));
    if(!o.length) break;
    const pick=Math.random()<0.78?o.reduce((a,b)=>exitDist[b[1]*GW+b[0]]<exitDist[a[1]*GW+a[0]]?b:a):o[Math.floor(Math.random()*o.length)];
    prev=[i,j]; [i,j]=pick; p.push(pick);
  }
  return p;
}
function updateScout(dt){
  if(!LV.scout||state!=='play'){ scout.g.visible=false; scoutLight.intensity=0; return; }
  if(!scout.path.length||scout.t>scout.path.length+0.2){ scout.path=scoutPath(); scout.t=0; }
  scout.t+=dt*4.5;
  const k=Math.min(Math.floor(scout.t),scout.path.length-1), f=Math.min(1,scout.t-k);
  const a=cellPos(...scout.path[k]), b=cellPos(...scout.path[Math.min(k+1,scout.path.length-1)]);
  const p=a.lerp(b,f); p.y=0.62+Math.sin(performance.now()/180)*0.04;
  const fade=Math.min(1,scout.t*3)*Math.min(1,(scout.path.length+0.2-scout.t)*3);
  scout.g.position.copy(p); scout.g.visible=true; scout.g.scale.setScalar(0.4+0.6*fade);
  scoutLight.position.copy(p); scoutLight.intensity=1.5*fade;
}

// ================= exit & end =================
function reachExit(){
  if(state!=='play') return;
  if(LV.capture&&captured<robbers.length){ if(!cop.lockMsg){ toast('Exit locked','Catch '+(robbers.length-captured)+' more robber'+(robbers.length-captured>1?'s':'')+' first.'); sfx.bump(); } cop.lockMsg=true; return; }
  state='exiting'; exitT=0; sfx.exit();
}
function endLevel(won,reason){
  endShown=true; document.getElementById('action').classList.add('hidden'); document.getElementById('swipe').classList.add('hidden');

    const t=playT, key=String(lvIdx), best=progress.best[key];
    const stars=t<=par?3:t<=par*1.5?2:1; progress.stars=progress.stars||{};
    const oldStars=progress.stars[key]||0; if(stars>oldStars) progress.stars[key]=stars;
    if(!progress.cleared.includes(lvIdx)) progress.cleared.push(lvIdx);
    const newBest=!best||t<best; if(newBest) progress.best[key]=t; saveProgress();

// ================= audio (all synthesized) =================
let ac=null, noiseBuf=null;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*0.2,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ ac=null; } }
  if(ac&&ac.state==='suspended') ac.resume(); if(ac) musicStart(); return ac; }
function beep(f,d,type,vol,f2,delay=0){ if(!ac||!soundOn) return; const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.03); }

  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.2; g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  s.connect(f).connect(g).connect(ac.destination); s.start(); s.stop(ac.currentTime+d+.02); }
const sfx={
  step:()=>noise(0.05,700+Math.random()*300,0.12),
  bump:()=>beep(110,0.14,'triangle',0.14,55),
  exit:()=>[523,659,784,1047,1319].forEach((f,k)=>beep(f,0.16,'square',0.05,null,k*0.09)),
  caught:()=>{ beep(620,0.7,'sawtooth',0.07,50); noise(0.4,300,0.2); },
  capture:()=>{ beep(880,0.1,'square',0.05,1320); beep(1320,0.14,'square',0.04,1760,0.08); },
  peek:()=>beep(260,0.35,'sine',0.06,900),
  power:()=>{ beep(240,0.9,'sawtooth',0.05,35); noise(0.25,1800,0.08); },

// ================= music: a synthesized chiptune score =================
// 8-bar loop in A minor (Am F C G | Am F Dm E). Drums, bass and arpeggio always play in-game;
// the lead melody comes in every other loop. Danger (a robber close by, or the clock running out)
// adds faster hi-hats, an extra kick and a little more tempo.
let musicOn=true; try{ musicOn=localStorage.getItem('mc3d-music')!=='off'; }catch(e){}
let musicGain=null, mTimer=null, mStep=0, mNext=0, mLoop=0, musicDanger=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const ROOTS=[45,41,48,43,45,41,50,40];
const CHORDS=[[57,60,64],[53,57,60],[55,60,64],[55,59,62],[57,60,64],[53,57,60],[53,57,62],[52,56,59]];
const LEAD=[
  76,0,0,74, 72,0,69,0, 72,0,74,0, 76,0,0,0,
  77,0,76,0, 74,0,72,0, 69,0,0,0, 72,0,0,0,
  76,0,0,79, 76,0,74,0, 72,0,74,0, 72,0,69,0,
  71,0,72,0, 74,0,71,0, 67,0,0,0, 0,0,0,0,
  76,0,0,74, 72,0,69,0, 72,0,74,0, 76,0,0,0,
  77,0,76,0, 74,0,72,0, 69,0,72,0, 77,0,0,0,
  74,0,0,72, 69,0,65,0, 69,0,72,0, 74,0,0,0,
  76,0,75,0, 76,0,71,0, 68,0,71,0, 76,0,0,0];
function mTone(freq,t,dur,type,vol,cut){
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  if(cut){ const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=cut; o.connect(fl).connect(g); } else o.connect(g);
  g.connect(musicGain); o.start(t); o.stop(t+dur+0.02);
}
function mKick(t,v=0.55){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g).connect(musicGain); o.start(t); o.stop(t+0.18); }
function mNoise(t,dur,type,freq,v){ const src=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain(); src.buffer=noiseBuf;
  fl.type=type; fl.frequency.value=freq; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(fl).connect(g).connect(musicGain); src.start(t); src.stop(t+dur+0.02); }
function musicMode(){ if(paused) return 'pause'; return (state==='intro'||state==='play'||state==='exiting')?'play':'calm'; }
function scheduleStep(step,t,mode,dur){
  const bar=Math.floor(step/16), s16=step%16, root=ROOTS[bar], ch=CHORDS[bar];
  const play=mode!=='calm', danger=play&&musicDanger>0.5, dark=LV&&LV.vis>1&&play;
  // bass
  if(s16%2===0){ const pat=[0,0,12,0,0,12,0,7][s16/2]; mTone(mf(root+pat),t,dur*1.7,play?'square':'triangle',play?0.07:0.08,play?900:600); }
  // arpeggio
  if(play||s16%2===0){ const n=ch[[0,1,2,1][s16%4]]+(s16>=8?12:0); mTone(mf(n),t,dur*0.9,'square',play?0.028:0.022,dark?1400:3200); }
  // lead melody on every other loop in-game
  if(play&&mLoop%2===1){ const m=LEAD[step]; if(m) mTone(mf(m),t,dur*2.6,'square',0.045,2600); }
  if(!play){ if(s16===0) mTone(mf(ch[2]+12),t,dur*6,'triangle',0.03); return; }
  // drums
  if(s16===0||s16===8||(danger&&s16===14)||(bar%2===1&&s16===10)) mKick(t);
  if(s16===4||s16===12) mNoise(t,0.13,'bandpass',1800,0.22);
  if(danger||s16%2===0) mNoise(t,0.035,'highpass',7000,danger?0.07:0.05);
}
function musicTick(){
  if(!ac||!musicGain) return;
  const mode=musicMode(), now=ac.currentTime;
  const vol=!musicOn?0:mode==='play'?0.9:mode==='pause'?0.25:0.6;
  musicGain.gain.setTargetAtTime(vol,now,0.25);
  if(mNext<now-0.05) mNext=now+0.05;                      // skip ahead after the tab was in the background
  while(mNext<now+0.12){
    const bpm=mode==='play'?(126+Math.min(lvIdx,9)*2+(musicDanger>0.5?10:0)):100, d=60/bpm/4;
    scheduleStep(mStep,mNext,mode,d); mNext+=d; mStep=(mStep+1)%128; if(mStep===0) mLoop++;
  }
}
function musicStart(){ if(!ac||mTimer) return; musicGain=ac.createGain(); musicGain.gain.value=0; musicGain.connect(ac.destination);
  mNext=ac.currentTime+0.1; mTimer=setInterval(musicTick,25); }
function setMusic(on,init){ musicOn=on; try{ localStorage.setItem('mc3d-music',on?'on':'off'); }catch(e){}
  document.querySelectorAll('.musicBtn').forEach(b=>{ b.textContent=on?'\u266A on':'\u266A off'; b.setAttribute('aria-label',on?'Music on':'Music off'); b.setAttribute('aria-pressed',on); });
  if(!init) audio(); }

    const st=document.createElement('span'); st.className='st'; const got=(progress.stars||{})[k]||0;
    st.textContent=unlocked?'\u2605'.repeat(got)+'\u2606'.repeat(3-got):'';
    e.append(n,nm,st,ch); e.onclick=()=>startLevel(k); g.appendChild(e);
  });
  const total=Object.values(progress.stars||{}).reduce((a,b)=>a+b,0);
  document.querySelector('#levels .sub').textContent='Stars '+total+' / '+LEVELS.length*3+'. Every try is a new maze. Beat par for 3 stars.';
  const lg=$('legend'); lg.innerHTML='';
  Object.values(FEAT).forEach(([name,col])=>{ const s=document.createElement('span'); const i=document.createElement('i'); i.style.background=col; s.append(i,document.createTextNode(name)); lg.appendChild(s); });
  show('levels'); show('mTitle');
}
function showTitle(){ if(state!=='title'||lvIdx!==0){ buildLevel(0); } state='title'; hideAllLayers(); show('title'); show('mTitle'); }

function startLevel(idx){
  audio(); hideAllLayers(); paused=false;
  fromTitle=(state==='title'&&idx===0);
  if(!(fromTitle&&lvIdx===0)) buildLevel(idx); else resetActors();
  state='intro'; it=0; setTops(false); timeWarned=0;
  $('toast').classList.add('off');
}
function startPlay(){
  state='play'; show('hud'); buildBars(); updateHUD();
  if(LV.peek==='player'||LV.blockade) show('action');
  if(!swipeHinted){ show('swipe'); $('swipe').style.opacity=.75; }
  toast('Beat '+(lvIdx+1)+': '+LV.name,LV.tip,4.5);
  if(hidBand){ blackoutT=0; sfx.power(); }
}
function pauseGame(){ if(state!=='play'&&state!=='exiting') return; paused=true; $('pText').textContent='Beat '+(lvIdx+1)+': '+LV.name+'. '+LV.tip; show('pauseCard'); }
function resume(){ paused=false; hide('pauseCard'); last=performance.now(); }

document.querySelectorAll('.musicBtn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setMusic(!musicOn); });
setMusic(musicOn,true);
$('bPlay').onclick=()=>startLevel(0);
$('bLevels').onclick=showLevels;
$('bBack').onclick=showTitle;
$('pause').onclick=pauseGame;
$('bResume').onclick=resume;
$('bRetry2').onclick=()=>startLevel(lvIdx);
$('bMenu2').onclick=showLevels;
{ const mb=document.createElement('button'); mb.className='ghost musicBtn'; $('bMenu2').after(mb); }
{ const s=document.createElement('button'); s.className='ghost'; s.textContent='Sound on';
  s.onclick=()=>{ soundOn=!soundOn; s.textContent=soundOn?'Sound on':'Sound off'; }; $('bMenu2').after(s); }
$('action').addEventListener('pointerdown',e=>e.stopPropagation());
$('action').onclick=doAction;
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });

// ================= input: swipe to run, tap for action =================
let pd=null;
canvas.addEventListener('pointerdown',e=>{ audio(); pd={x:e.clientX,y:e.clientY,t:performance.now(),sw:false,id:e.pointerId}; });
addEventListener('pointermove',e=>{ if(!pd||e.pointerId!==pd.id) return;
  const dx=e.clientX-pd.x, dy=e.clientY-pd.y, th=Math.max(16,Math.min(innerWidth,innerHeight)*0.03);
  if(Math.hypot(dx,dy)>th){ setWant(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]); pd.x=e.clientX; pd.y=e.clientY; pd.sw=true; } });
addEventListener('pointerup',e=>{ if(!pd||e.pointerId!==pd.id) return; if(!pd.sw&&performance.now()-pd.t<350&&(LV.peek==='player'||LV.blockade)) doAction(); pd=null; });
addEventListener('pointercancel',()=>pd=null);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(), m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(m[k]&&state==='play'){ e.preventDefault(); setWant(m[k]); }
  else if((k===' '||k==='enter')&&state==='play'&&e.target===document.body){ e.preventDefault(); doAction(); }
  else if(k==='escape'||k==='p'){ paused?resume():pauseGame(); }
});

// ================= layout =================
let BW=1,BH=1; const P0=new THREE.Vector3(), T0=new THREE.Vector3(); let H0=40;
function layout(){
  const dpr=Math.min(devicePixelRatio||1,1.75); renderer.setPixelRatio(dpr); renderer.setSize(innerWidth,innerHeight,false);
  BW=Math.round(innerWidth*dpr); BH=Math.round(innerHeight*dpr);
  oCam.left=0; oCam.right=BW; oCam.top=BH; oCam.bottom=0; oCam.updateProjectionMatrix();
  const s=Math.min(BW*0.94/IMG_W,BH*0.92/IMG_H), left=(BW-IMG_W*s)/2, top=BW<BH?BH*0.12:(BH-IMG_H*s)/2*0.7;
  imgPlane.scale.set(IMG_W*s,IMG_H*s,1); imgPlane.position.set(left+IMG_W*s/2,BH-(top+IMG_H*s/2),0);
  fadePlane.scale.set(BW,BH,1); fadePlane.position.set(BW/2,BH/2,0);
  cam.aspect=BW/BH; cam.updateProjectionMatrix();
  const tf=Math.tan(THREE.MathUtils.degToRad(15));
  H0=Math.max((GH*CZ+0.8)/(2*tf),(GW+2)/(2*tf*cam.aspect))*1.04;
  const wpp=2*H0*tf/BH, dy=(top+IMG_H*s/2)-BH/2;              // line the flat maze up with the title image
  T0.set((GW+1)/2,0,GH*CZ/2-dy*wpp); P0.set(T0.x,H0,T0.z);
}
addEventListener('resize',layout); layout();

// ================= per-frame =================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), remap=(x,a,b)=>clamp((x-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, smooth=x=>x*x*(3-2*x), lerp=THREE.MathUtils.lerp;
const tmpC=new THREE.Color(), UP_TOP=new THREE.Vector3(0,0,-1), UP_Y=new THREE.Vector3(0,1,0), WHITE=new THREE.Color(0xffffff), HOLO=new THREE.Color(0x7fe8e0);
let rise=0, inside=0;
function applyE(e){
  const hWall=WALL_H*smooth(remap(e,.15,.7)); rise=hWall/WALL_H;
  wallRoot.scale.y=Math.max(0.012,hWall);
  inside=smooth(remap(e,.5,.95));
  atariFloorMat.opacity=1-smooth(remap(e,.35,.7)); atariFloor.visible=atariFloorMat.opacity>0.002;
  const tc=smooth(remap(e,.35,.75)); topMat.color.copy(tmpC.set(COL.green).lerp(TOP_IN,tc)); hidTop.color.copy(topMat.color);
  setTops(e>=0.8);
  amb.intensity=lerp(.55,.5,inside); amb.color.copy(tmpC.set(0xffffff).lerp(AMB_IN,inside));
  sun.intensity=lerp(.5,.42,inside);
  scene.fog.color.copy(tmpC.set(0).lerp(FOG_IN,inside)); scene.fog.near=lerp(500,7,inside); scene.fog.far=lerp(1000,17,inside);
  const dv=e>0.6; doorHalves.forEach(h=>h.visible=dv); doorLamp.visible=dv; hazFloor.visible=dv;
}
function followPose(p){
  const asp=BW/BH, d=asp<0.75?9.4:asp<1.2?7.8:6.6, pitch=THREE.MathUtils.degToRad(60);
  // keep the view inside the maze so the edges don't show empty space
  const hw=Math.max(1,d*Math.tan(Math.atan(Math.tan(THREE.MathUtils.degToRad(22.5))*asp))*0.85);
  const x=hw*2<GW?clamp(p.x,hw,GW-hw):GW/2, z=clamp(p.z,1.2,GH*CZ-(asp>1.2?2.6:3.4));
  return {pos:new THREE.Vector3(x,d*Math.sin(pitch),z+d*Math.cos(pitch)),tgt:new THREE.Vector3(x,0,z-0.15)};
}
function angLerp(a,b,k){ let d=b-a; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return a+d*k; }
function placeFig(m,fig,pos,dt,moving){
  fig.root.position.copy(pos);
  const ty=Math.atan2(-m.dir[1],m.dir[0]); m.yaw=angLerp(m.yaw,ty,1-Math.exp(-14*dt)); fig.root.rotation.y=m.yaw;
  m.runK=lerp(m.runK||0,moving?1:0,1-Math.exp(-10*dt));
  pose(fig,m.dist,m.runK,0,m.stun>0);
  const k=Math.max(0.05,smooth(remap(rise,0.1,0.7)));
  fig.root.scale.set(1.25,1.25*k,1.25);
}
const exitPos=new THREE.Vector3();
function placeFigures(dt,copMoved=0,robMoved=[]){
  if(!cop) return;
  const p=state==='exiting'?exitPos:posOf(cop);
  placeFig(cop,copFig,p,dt,copMoved>0);
  copFig.root.visible=!(state==='exiting'&&exitPos.x>GW+1.1);
  const blink=cop.invuln>0&&state==='play'?(Math.floor(performance.now()/90)%2===0):true; copFig.body.visible=blink;
  robbers.forEach((r,k)=>{ r.fig.root.visible=r.alive; if(r.alive) placeFig(r,r.fig,posOf(r),dt,(robMoved[k]||0)>0); });
}
const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function update(dt){
  const cp=cop?posOf(cop):new THREE.Vector3();
  let copMoved=0; const robMoved=[];
  if(state==='title'){
    applyE(0); imgMat.opacity=1; fadeMat.opacity=0;
    cam.fov=30; cam.up.copy(UP_TOP); cam.position.copy(P0); cam.lookAt(T0);
  } else if(state==='intro'){
    it+=dt;
    const F=fromTitle?0.6:0, H=fromTitle?0.35:0.45, SW=2.6;
    imgMat.opacity=fromTitle?1-remap(it,0,F):0;
    fadeMat.opacity=fromTitle?0:1-remap(it,0,0.35);
    const e=ease(remap(it,F+H,F+H+SW)); applyE(e);
    const c=followPose(cp);
    const pos=new THREE.Vector3().lerpVectors(P0,c.pos,smooth(remap(e,0,0.8))); pos.y=H0*Math.pow(c.pos.y/H0,e);
    const tgt=new THREE.Vector3().lerpVectors(T0,c.tgt,smooth(remap(e,0,0.9)));
    cam.fov=lerp(30,45,smooth(remap(e,0.3,1)));
    cam.up.copy(UP_TOP).lerp(UP_Y,smooth(remap(e,0.2,0.9))).normalize(); cam.position.copy(pos); cam.lookAt(tgt);
    camPos.copy(c.pos); camTgt.copy(c.tgt);
    if(e>=1) startPlay();
  } else {
    applyE(1); imgMat.opacity=0; fadeMat.opacity=0;
    if(state==='play'){
      playT+=dt;
      if(LV.time){ const left=LV.time-playT;
        if(left<=5&&Math.ceil(left)!==timeWarned){ timeWarned=Math.ceil(left); beep(left<=2?1320:990,0.07,'square',0.06); }
        if(left<=0){ timeUp(); } }
      if(cop.stun>0) cop.stun-=dt; else copMoved=stepMover(cop,dt,copChoose,copArrive);
      cop.invuln-=dt;
      cop.stepAcc+=copMoved; if(cop.stepAcc>0.4){ cop.stepAcc=0; sfx.step(); }
      if(copMoved>0.001&&cop.lockMsg&&cop.i<GW-1) cop.lockMsg=false;
      robbers.forEach((r,k)=>{ if(!r.alive) return; if(r.stun>0){ r.stun-=dt; robMoved[k]=0; } else robMoved[k]=stepMover(r,dt,robChoose,null); });
      const c2=posOf(cop);
      { let dmin=99; robbers.forEach(r=>{ if(r.alive&&!LV.capture) dmin=Math.min(dmin,c2.distanceTo(posOf(r))); });
        musicDanger=Math.max(clamp(1-(dmin-0.8)/2.6), LV.time&&LV.time-playT<=6?1:0); }
      for(const r of robbers){ if(!r.alive||state!=='play') continue;
        if(c2.distanceTo(posOf(r))<0.42){
          if(LV.capture){ r.alive=false; captured++; sfx.capture(); burst.position.copy(posOf(r)); burst.position.y=0.05; burst.material.color.set(r.color); burstT=0.5; burst.visible=true; buildBars();
            if(captured===robbers.length) toast('Exit unlocked','Every robber is in cuffs. Head for the door on the right.'); }
          else if(LV.wounds){ if(cop.invuln<=0){ cop.stun=1.6; cop.invuln=3.4; r.stun=1.2; r.dir=[-r.dir[0],-r.dir[1]]; if(r.moving){ [r.i,r.ni]=[r.ni,r.i]; [r.j,r.nj]=[r.nj,r.j]; r.prog=1-r.prog; } sfx.wound(); flash(); } }
          else lose();
        } }
      if(blockade.t>0){ blockade.t-=dt; if(blockade.t<=0){ blockade.g.visible=false; blockade.cell=null; } else blockade.g.children.forEach(o=>{ if(o.material&&o.material.color&&o.material.isMeshBasicMaterial) o.visible=blockade.t>2||Math.floor(blockade.t*6)%2===0; }); }
      if(LV.peek==='auto'){ autoPeekT+=dt; if(autoPeekT>5.5){ autoPeekT=0; peekT=1.0; sfx.peek(); } }
      updateHUD();
    } else if(state==='exiting'){
      exitT+=dt; exitPos.x+=SPEEDS[LV.speed]*0.8*dt; copMoved=1; cop.dir=[1,0];
      cop.dist+=SPEEDS[LV.speed]*0.8*dt;
      if(exitT>1.6&&!endShown) endLevel(true);
    }
    // follow camera
    const target=state==='exiting'?exitPos:posOf(cop), f=followPose(target), k=1-Math.exp(-5*dt);
    camPos.lerp(f.pos,k); camTgt.lerp(f.tgt,k);
    cam.fov=45; cam.up.copy(UP_Y); cam.position.copy(camPos); cam.lookAt(camTgt);
  }
  if(state==='exiting'&&exitT===0) {}
  // blackout / peek
  if(peekT>0) peekT-=dt;
  let base=1;
  if(blackoutT>=0){ blackoutT+=dt; base=blackoutT<0.9?(Math.random()<blackoutT/0.9?0.1:1):0; darkMat.opacity=0.5*smooth(remap(blackoutT,0,0.9)); }
  const peeking=peekT>0;
  hidOp=Math.max(base,peeking?0.55:0);
  hidSide.opacity=hidTop.opacity=hidOp; if(hiddenMesh) hiddenMesh.visible=hidOp>0.01;
  hidSide.color.copy(peeking&&base<1?HOLO:WHITE); hidSide.depthWrite=hidOp>0.9;
  if(peeking&&blackoutT>=0) darkMat.opacity=0.2;
  // door
  const ez=(exitRow+0.5)*CZ, locked=LV&&LV.capture&&captured<robbers.length;
  const near=cop&&(state==='exiting'||(Math.abs(posOf(cop).x-(GW-0.5))<3.2&&Math.abs(posOf(cop).z-ez)<2.2));
  doorOpen=lerp(doorOpen,(near&&!locked&&inside>0.9)?1:0,1-Math.exp(-4*dt));
  doorHalves[0].position.z=ez-CZ/4-doorOpen*CZ*0.55; doorHalves[1].position.z=ez+CZ/4+doorOpen*CZ*0.55;
  doorLamp.material.color.set(locked?0xe03030:0x46f0cf);
  beyond.visible=doorOpen>0.03; doorLight.intensity=inside*(0.3+1.4*doorOpen);
  // lights near the cop
  const lp=state==='exiting'?exitPos:(cop?posOf(cop):T0);
  const nearL=lampSpots.map(v=>[v,v.distanceToSquared(lp)]).sort((a,b)=>a[1]-b[1]).slice(0,pool.length);
  pool.forEach((l,k)=>{ if(nearL[k]){ l.position.copy(nearL[k][0]); l.intensity=1.1*inside; } else l.intensity=0; });
  copLight.position.set(lp.x,0.9,lp.z); copLight.intensity=0.8*inside;
  updateScout(dt);
  if(burstT>0){ burstT-=dt; const k=1-burstT/0.5; burst.scale.setScalar(1+k*5); burst.material.opacity=1-k; if(burstT<=0) burst.visible=false; }
  placeFigures(dt,copMoved,robMoved);
  cam.near=Math.min(20,Math.max(0.05,cam.position.y*0.2)); cam.updateProjectionMatrix();
}
function draw(){ renderer.clear(); if(state!=='title') renderer.render(scene,cam); renderer.clearDepth(); renderer.render(oScene,oCam); }

// hook: when the cop reaches the exit, start the walk-out from the exit cell
const _reachExit=reachExit;
reachExit=function(){ _reachExit(); if(state==='exiting'){ cellPos(GW-1,exitRow,exitPos); } };

let last=performance.now();
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-last)/1000); last=now; if(!paused) update(dt); draw(); }
buildLevel(0); state='title'; requestAnimationFrame(frame);
</script>
